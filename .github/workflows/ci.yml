name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      # The server release the contract lock names: the lock is the one place that says which server this is built on,
      # and `scripts/contract verify` refuses any bundle that is not that release's.
      - name: Prepare pinned contract
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("Contract/contract.lock"))["serverVersion"])')
          git clone --depth 1 --branch "v$version" https://github.com/purlay/purlay.git "$RUNNER_TEMP/server"
          (cd "$RUNNER_TEMP/server" && bun install --frozen-lockfile && bun run contract:bundle --out "$GITHUB_WORKSPACE/Contract/bundle")
      - name: Verify
        run: scripts/verify
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
