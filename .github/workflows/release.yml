name: Release
on:
  push:
    tags: ['v*']
  # A rehearsal: from a branch, every lane runs on the release's machine and nothing is published.
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  PURLAY_CACHE_DIR: ${{ github.workspace }}/.cache/compilation

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag has release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release-notes "${GITHUB_REF_NAME#v}" > /dev/null
      - id: bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Contract/bundle
          key: contract-bundle-${{ hashFiles('Contract/contract.lock') }}
      - name: Prepare the pinned contract
        if: steps.bundle.outputs.cache-hit != 'true'
        run: scripts/prepare-contract
        env:
          GH_TOKEN: ${{ github.token }}
      - id: when
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # A release starts from the latest compilation cache of the week and every lane runs, in order, on one machine.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PURLAY_CACHE_DIR }}
          key: cas-release-${{ steps.when.outputs.week }}-${{ github.sha }}
          restore-keys: |
            cas-test-contract-${{ steps.when.outputs.week }}-
            cas-test-kit-${{ steps.when.outputs.week }}-
            cas-ios-${{ steps.when.outputs.week }}-
      - name: Verify
        run: scripts/verify
        env:
          BRANCH: main
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the release
        run: |
          scripts/release-notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "purlay-swift ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
